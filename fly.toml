# fly.toml - Fly.io configuration for GesturePro API
# See https://fly.io/docs/reference/configuration/

app = 'gesturepro-api'
primary_region = 'ewr'

[build]
  dockerfile = 'server/Dockerfile.fly'

[env]
  YOLO_MODEL_PATH = '/server/ml/saved_models/yolo/yolo_best.pt'
  CLASS_NAMES_PATH = '/server/ml/saved_models/yolo/class_names.json'
  ML_MODELS_PATH = '/server/ml/saved_models'
  PYTHONPATH = '/server'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
